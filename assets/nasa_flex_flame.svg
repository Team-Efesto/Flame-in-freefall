<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Background Space / Chamber Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="60%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Outer Radiative Halo (Cool Flame Glow) -->
    <radialGradient id="outerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0e172a" stop-opacity="0" />
    </radialGradient>

    <!-- Spherical Blue Flame Front (CH* Chemiluminescence) -->
    <radialGradient id="flameShell" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="93%" stop-color="#0284c7" stop-opacity="0.95" />
      <stop offset="98%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Vapor Zone -->
    <radialGradient id="vaporZone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0e172a" stop-opacity="0" />
    </radialGradient>

    <!-- Droplet Liquid Core (n-Heptane / Alkane) -->
    <radialGradient id="dropletCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="90%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>

    <!-- Fiber Holder Gradient -->
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.2" />
    </linearGradient>

    <filter id="flameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Experimental Chamber Grid -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4 6">
    <line x1="80" y1="40" x2="80" y2="480" />
    <line x1="200" y1="40" x2="200" y2="480" />
    <line x1="320" y1="40" x2="320" y2="480" />
    <line x1="400" y1="40" x2="400" y2="480" stroke-opacity="0.75" />
    <line x1="480" y1="40" x2="480" y2="480" />
    <line x1="600" y1="40" x2="600" y2="480" />
    <line x1="720" y1="40" x2="720" y2="480" />

    <line x1="40" y1="90" x2="760" y2="90" />
    <line x1="40" y1="175" x2="760" y2="175" />
    <line x1="40" y1="260" x2="760" y2="260" stroke-opacity="0.75" />
    <line x1="40" y1="345" x2="760" y2="345" />
    <line x1="40" y1="430" x2="760" y2="430" />
  </g>

  <!-- Concentric Isotherms / Coordinate Rings -->
  <circle cx="400" cy="260" r="220" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="3 5" />
  <circle cx="400" cy="260" r="160" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="4 4" />
  <circle cx="400" cy="260" r="100" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="2 3" />

  <!-- Outer Thermal & Radiative Dissipation Glow -->
  <circle cx="400" cy="260" r="210" fill="url(#outerHalo)" filter="url(#flameGlow)" />

  <!-- Diffusive Cool Flame Outer Envelope -->
  <circle cx="400" cy="260" r="148" fill="url(#vaporZone)" />

  <!-- Spherical Flame Front (Luminous Shell) -->
  <circle cx="400" cy="260" r="145" fill="url(#flameShell)" filter="url(#flameGlow)" />
  <circle cx="400" cy="260" r="145" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-opacity="0.85" filter="url(#flameGlow)" />

  <!-- Diffusive Inner Field Rays -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25">
    <line x1="400" y1="260" x2="300" y2="160" stroke-dasharray="2 4" />
    <line x1="400" y1="260" x2="500" y2="160" stroke-dasharray="2 4" />
    <line x1="400" y1="260" x2="300" y2="360" stroke-dasharray="2 4" />
    <line x1="400" y1="260" x2="500" y2="360" stroke-dasharray="2 4" />
    <line x1="400" y1="260" x2="400" y2="115" stroke-dasharray="2 4" />
    <line x1="400" y1="260" x2="400" y2="405" stroke-dasharray="2 4" />
    <line x1="400" y1="260" x2="255" y2="260" stroke-dasharray="2 4" />
    <line x1="400" y1="260" x2="545" y2="260" stroke-dasharray="2 4" />
  </g>

  <!-- Quartz Fiber Needle Supports (FLEX Tether System) -->
  <line x1="60" y1="260" x2="378" y2="260" stroke="url(#fiberGrad)" stroke-width="2.5" />
  <circle cx="378" cy="260" r="3.5" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5" />
  
  <line x1="740" y1="260" x2="422" y2="260" stroke="url(#fiberGrad)" stroke-width="2.5" />
  <circle cx="422" cy="260" r="3.5" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5" />

  <!-- Liquid Fuel Droplet (Core) -->
  <circle cx="400" cy="260" r="22" fill="url(#dropletCore)" filter="url(#flameGlow)" />
  <circle cx="394" cy="254" r="5" fill="#ffffff" fill-opacity="0.75" />

  <!-- Scientific Annotations & HUD Overlays -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">
    <!-- Top-left Mission HUD -->
    <rect x="25" y="24" width="235" height="48" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" />
    <text x="38" y="44" font-weight="700" fill="#38bdf8" font-size="12">NASA FLEX-2 • ISS CIR</text>
    <text x="38" y="61" fill="#94a3b8" font-size="10">Microgravity Droplet Combustion (Ra ≈ 0)</text>

    <!-- Top-right Telemetry HUD -->
    <rect x="540" y="24" width="235" height="48" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" />
    <text x="553" y="44" font-weight="700" fill="#10b981" font-size="11">g_eff = 10⁻⁵ g_e • Pure Diffusion</text>
    <text x="553" y="61" fill="#94a3b8" font-size="10">Fuel: n-Heptane | Spherical Flame</text>

    <!-- Callout 1: Droplet Core -->
    <path d="M 400 238 L 400 180 L 330 180" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="400" cy="238" r="3" fill="#38bdf8" />
    <text x="210" y="176" fill="#e2e8f0" font-weight="600" font-size="11">Droplet Core d₀ ≈ 2.5 mm</text>
    <text x="210" y="191" fill="#94a3b8" font-size="9.5">Suspended liquid fuel</text>

    <!-- Callout 2: Flame Front -->
    <path d="M 503 158 L 540 120 L 630 120" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="503" cy="158" r="3" fill="#38bdf8" />
    <text x="550" y="115" fill="#38bdf8" font-weight="700" font-size="11">Spherical Flame Front</text>
    <text x="550" y="130" fill="#94a3b8" font-size="9.5">Pure radial symmetry • Cool Flame</text>

    <!-- Callout 3: Quartz Fiber Support -->
    <path d="M 230 260 L 230 330 L 170 330" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="230" cy="260" r="3" fill="#64748b" />
    <text x="75" y="326" fill="#cbd5e1" font-weight="600" font-size="11">Quartz fibers (Tether)</text>
    <text x="75" y="341" fill="#94a3b8" font-size="9.5">Minimum-conductivity support</text>

    <!-- Bottom HUD Bar -->
    <rect x="25" y="456" width="750" height="40" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" />
    <circle cx="45" cy="476" r="5" fill="#38bdf8" />
    <text x="60" y="480" fill="#e2e8f0" font-size="10.5">
      <tspan font-weight="700" fill="#38bdf8">NASA PSI EXPERIMENTAL EVIDENCE:</tspan>
      In microgravity, the absence of buoyancy removes the convective cone. The flame is perfectly spherical and burns at lower temperatures.
    </text>
  </g>
</svg>
